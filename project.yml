name: WallpaperSelection
options:
  bundleIdPrefix: com.miguelroca
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 482P49H435 # Personal Team (free Apple ID)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WallpaperSelection:
    type: application
    platform: iOS
    sources: [WallpaperSelection]
    info:
      path: WallpaperSelection/Info.plist
      properties:
        CFBundleDisplayName: Wallpapers
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "Wallpapers looks through your photos to find ones without people that would make good wallpapers. Everything is analyzed on your iPhone."
        NSPhotoLibraryAddUsageDescription: "Wallpapers adds the photos you swipe right on to your Wallpapers album."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguelroca.wallpaperselection
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [WallpaperSelectionTests, WallpaperSelectionUITests]
  WallpaperSelectionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WallpaperSelectionTests
        excludes: ["Fixtures/**"]
      - path: WallpaperSelectionTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: WallpaperSelection
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WallpaperSelectionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WallpaperSelectionUITests]
    dependencies:
      - target: WallpaperSelection
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
